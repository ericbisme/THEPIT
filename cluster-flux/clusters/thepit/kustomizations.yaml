apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thepit-nfs
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster-flux/infrastructure/nfs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thepit-cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster-flux/infrastructure/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thepit-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: thepit-nfs
  interval: 10m
  path: ./cluster-flux/infrastructure/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 15m
---
