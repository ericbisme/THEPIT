apiVersion: v1
kind: Service
metadata:
  name: nut-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: nut-exporter
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9199
      targetPort: 9199
---
apiVersion: v1
kind: Endpoints
metadata:
  name: nut-exporter
  namespace: observability
subsets:
  - addresses:
      - ip: 192.168.10.125
    ports:
      - name: metrics
        port: 9199
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nut-exporter
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nut-exporter
  endpoints:
    - port: metrics
      path: /ups_metrics
      interval: 30s
      # nut_exporter requires an explicit UPS name once NUT exposes more than
      # one device. Keep this pinned even while Porter has only one attached.
      params:
        ups:
          - cyberpower
      metricRelabelings:
        - targetLabel: ups
          replacement: cyberpower
