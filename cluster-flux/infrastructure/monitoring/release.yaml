apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: nfs-subdir-external-provisioner
  interval: 30m
  releaseName: kube-prometheus-stack
  targetNamespace: observability
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    alertmanager:
      enabled: false
    grafana:
      enabled: true
      admin:
        # Created outside Git as observability/grafana-admin-credentials.
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        type: sts
        storageClassName: thepit-nfs
        accessModes:
          - ReadWriteOnce
        size: 2Gi
      # thepit-nfs is root-squashed, so Grafana's root init container cannot
      # chown the provisioned directory. The pod's fsGroup owns its volume.
      initChownData:
        enabled: false
      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.10.129
        annotations:
          metallb.io/address-pool: thepit-services
          external-dns.alpha.kubernetes.io/controller: dns-controller
          external-dns.alpha.kubernetes.io/hostname: grafana.ericbisme.net
          external-dns.alpha.kubernetes.io/target: 192.168.10.129
    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: thepit-nfs
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
