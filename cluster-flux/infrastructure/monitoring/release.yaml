apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: nfs-subdir-external-provisioner
  interval: 30m
  releaseName: kube-prometheus-stack
  targetNamespace: observability
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    prometheus-node-exporter:
      hostNetwork: false
      hostPID: false
    alertmanager:
      enabled: false
    grafana:
      enabled: true
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.logging.svc.cluster.local:3100
          isDefault: false
      admin:
        # Created outside Git as observability/grafana-admin-credentials.
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        type: sts
        storageClassName: thepit-nfs
        accessModes:
          - ReadWriteOnce
        size: 2Gi
      # thepit-nfs is root-squashed, so Grafana's root init container cannot
      # chown the provisioned directory. The pod's fsGroup owns its volume.
      initChownData:
        enabled: false
      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.10.129
        annotations:
          metallb.io/address-pool: thepit-services
          external-dns.alpha.kubernetes.io/controller: dns-controller
          external-dns.alpha.kubernetes.io/hostname: grafana.ericbisme.net
          external-dns.alpha.kubernetes.io/target: 192.168.10.129
      # Official UniFi Poller Prometheus dashboards, pinned to revisions so a
      # Grafana.com update cannot silently change the UI.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: UniFi Poller
              type: file
              disableDeletion: false
              editable: false
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          unifi-client-dpi:
            gnetId: 11310
            revision: 5
            datasource: Prometheus
          unifi-network-sites:
            gnetId: 11311
            revision: 5
            datasource: Prometheus
          unifi-usw-insights:
            gnetId: 11312
            revision: 9
            datasource: Prometheus
          unifi-usg-insights:
            gnetId: 11313
            revision: 9
            datasource: Prometheus
          unifi-uap-insights:
            gnetId: 11314
            revision: 10
            datasource: Prometheus
          unifi-client-insights:
            gnetId: 11315
            revision: 9
            datasource: Prometheus
          thepit-ups:
            json: |
              {
                "annotations": {"list": []},
                "editable": false,
                "graphTooltip": 1,
                "panels": [
                  {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "id": 1, "title": "APC battery charge", "type": "timeseries", "targets": [{"expr": "ups_battery_charge_percent{service=\"apc-snmp-exporter\"}", "legendFormat": "APC", "refId": "A"}]},
                  {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "id": 2, "title": "CyberPower battery charge", "type": "timeseries", "targets": [{"expr": "network_ups_tools_battery_charge{job=\"nut-exporter\"}", "legendFormat": "{{ups}}", "refId": "A"}]},
                  {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "id": 3, "title": "APC runtime", "type": "timeseries", "targets": [{"expr": "ups_battery_runtime_ticks{service=\"apc-snmp-exporter\"} / 100", "legendFormat": "APC", "refId": "A"}]},
                  {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "id": 4, "title": "CyberPower runtime", "type": "timeseries", "targets": [{"expr": "network_ups_tools_battery_runtime{job=\"nut-exporter\"}", "legendFormat": "{{ups}}", "refId": "A"}]},
                  {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"unit": "volt"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16}, "id": 5, "title": "APC input/output voltage", "type": "timeseries", "targets": [{"expr": "ups_input_voltage_volts{service=\"apc-snmp-exporter\"}", "legendFormat": "input", "refId": "A"}, {"expr": "ups_output_voltage_volts{service=\"apc-snmp-exporter\"}", "legendFormat": "output", "refId": "B"}]},
                  {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"unit": "volt"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16}, "id": 6, "title": "CyberPower input/output voltage", "type": "timeseries", "targets": [{"expr": "network_ups_tools_input_voltage{job=\"nut-exporter\"}", "legendFormat": "{{ups}} input", "refId": "A"}, {"expr": "network_ups_tools_output_voltage{job=\"nut-exporter\"}", "legendFormat": "{{ups}} output", "refId": "B"}]},
                  {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16}, "id": 7, "title": "UPS load", "type": "timeseries", "targets": [{"expr": "ups_output_load_percent{service=\"apc-snmp-exporter\"}", "legendFormat": "APC", "refId": "A"}, {"expr": "network_ups_tools_ups_load{job=\"nut-exporter\"}", "legendFormat": "CyberPower {{ups}}", "refId": "B"}]}
                ],
                "refresh": "30s",
                "schemaVersion": 39,
                "tags": ["thepit", "ups"],
                "templating": {"list": []},
                "time": {"from": "now-24h", "to": "now"},
                "title": "THEPIT UPS",
                "uid": "thepit-ups",
                "version": 1
              }
    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: thepit-nfs
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
