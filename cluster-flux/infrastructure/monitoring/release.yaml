apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: nfs-subdir-external-provisioner
  interval: 30m
  releaseName: kube-prometheus-stack
  targetNamespace: observability
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    alertmanager:
      enabled: false
    grafana:
      enabled: true
      admin:
        # Created outside Git as observability/grafana-admin-credentials.
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        type: sts
        storageClassName: thepit-nfs
        accessModes:
          - ReadWriteOnce
        size: 2Gi
      # thepit-nfs is root-squashed, so Grafana's root init container cannot
      # chown the provisioned directory. The pod's fsGroup owns its volume.
      initChownData:
        enabled: false
      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.10.129
        annotations:
          metallb.io/address-pool: thepit-services
          external-dns.alpha.kubernetes.io/controller: dns-controller
          external-dns.alpha.kubernetes.io/hostname: grafana.ericbisme.net
          external-dns.alpha.kubernetes.io/target: 192.168.10.129
      # Official UniFi Poller Prometheus dashboards, pinned to revisions so a
      # Grafana.com update cannot silently change the UI.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: UniFi Poller
              type: file
              disableDeletion: false
              editable: false
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          unifi-client-dpi:
            gnetId: 11310
            revision: 5
            datasource: Prometheus
          unifi-network-sites:
            gnetId: 11311
            revision: 5
            datasource: Prometheus
          unifi-usw-insights:
            gnetId: 11312
            revision: 9
            datasource: Prometheus
          unifi-usg-insights:
            gnetId: 11313
            revision: 9
            datasource: Prometheus
          unifi-uap-insights:
            gnetId: 11314
            revision: 10
            datasource: Prometheus
          unifi-client-insights:
            gnetId: 11315
            revision: 9
            datasource: Prometheus
    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: thepit-nfs
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
