apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: pihole
    sources:
      - ingress
      - service
    policy: upsert-only
    registry: noop
    domainFilters:
      - ericbisme.net
    annotationFilter: external-dns.alpha.kubernetes.io/controller=dns-controller
    extraArgs:
      - --pihole-api-version=6
      - --pihole-server=http://192.168.1.3
    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pihole-credentials
            key: password
