apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: logging
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: thepit-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 720h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
      allow_structured_metadata: true
      volume_enabled: true
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      compaction_interval: 10m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: loki
          image: grafana/loki:3.7.2
          args: [-config.file=/etc/loki/config/config.yaml]
          ports:
            - {name: http, containerPort: 3100}
            - {name: grpc, containerPort: 9096}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki/config, readOnly: true}
            - {name: data, mountPath: /var/loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logging
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - {name: http, port: 3100, targetPort: http}
