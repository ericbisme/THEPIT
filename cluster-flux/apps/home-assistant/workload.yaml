apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: thepit
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: thepit-nfs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: thepit
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node1
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.2@sha256:6e8225ea9de2cfe9292b634e554ebbf439118ca0c823221d794298e7a74404bb
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Denver
          ports:
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: thepit
  labels:
    app.kubernetes.io/name: home-assistant
  annotations:
    metallb.io/address-pool: thepit-services
    external-dns.alpha.kubernetes.io/controller: dns-controller
    external-dns.alpha.kubernetes.io/hostname: homeassistant.ericbisme.net
    external-dns.alpha.kubernetes.io/target: 192.168.10.130
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.130
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
