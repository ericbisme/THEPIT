---
# This playbook is intentionally self-contained so the ansible/ directory can
# be copied to the iMac and run with: ansible-playbook -i localhost, -c local
- name: Reconcile the iMac CyberPower UPS and exporter
  hosts: all
  become: true
  vars_files:
    - inventory/host_vars/cyberpower-imac.yml
  tasks:
    - name: Set the iMac system hostname
      ansible.builtin.hostname:
        name: saison
  roles:
    - nut
