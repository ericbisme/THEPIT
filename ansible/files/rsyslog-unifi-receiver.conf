# Managed from the personal repository workspace.
# Receive UniFi and APC infrastructure syslog over UDP and keep it separate from host logs.

module(load="imudp")

template(
  name="UniFiRemoteFile"
  type="string"
  string="/var/log/remote/unifi/%HOSTNAME:::secpath-replace%.log"
)

template(
  name="APCRemoteFile"
  type="string"
  string="/var/log/remote/apc/apcF8EE73.log"
)

template(
  name="APCNormalizedMessage"
  type="string"
  string="%TIMESTAMP% apcF8EE73 %syslogtag%%msg%\n"
)

ruleset(name="unifi_remote") {
  if $fromhost-ip == "192.168.1.93" then {
    action(
      type="omfile"
      dynaFile="APCRemoteFile"
      template="APCNormalizedMessage"
      createDirs="on"
      dirCreateMode="0750"
      fileCreateMode="0640"
    )
    stop
  }

  action(
    type="omfile"
    dynaFile="UniFiRemoteFile"
    createDirs="on"
    dirCreateMode="0750"
    fileCreateMode="0640"
  )
  stop
}

input(type="imudp" port="514" ruleset="unifi_remote")
