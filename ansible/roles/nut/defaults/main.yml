---

nut_host: localhost
nut_max_retry: 3
nut_mode: netserver
nut_remove_shutdown_script: true
nut_driver_service_enabled: false
nut_ups_name: "cyberpower"

nut_user_master_name: monuser
nut_user_master_password: monpassword

nut_user_slave_name: monuserslave
nut_user_slave_password: monslavepassword

nut_vendorid:  "0764"
nut_productid: "0501"

nut_ups_devices:
  - |
    [cyberpower]
      driver = "usbhid-ups"
      port = "auto"
      vendorid = "0764"
      productid = "0501"
      product = "CP1500PFCLCD"
      serial = "000000000000"
      vendor = "CPS"
      bus = "001"
      desc = "CyberPower on Porter"

nut_ups_monitors:
  - "MONITOR cyberpower@localhost 1 {{ nut_user_master_name }} {{ nut_user_master_password }} master"

nut_ups_listen: |
  LISTEN 127.0.0.1 3493
  LISTEN {{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }} 3493
  LISTEN ::1 3493


# Optional Prometheus exporter for hosts with a locally attached UPS.
nut_exporter_enabled: false
nut_exporter_version: "3.3.0"
nut_exporter_url: "https://github.com/DRuggeri/nut_exporter/releases/download/v{{ nut_exporter_version }}/nut_exporter-v{{ nut_exporter_version }}-linux-amd64"
nut_exporter_checksum: "sha256:8183da720ff547b7be56cc60505a3e0b731ccbf23aa18b3e297159b261500d8a"
nut_exporter_server: "127.0.0.1"
nut_exporter_server_port: 3493
nut_exporter_username: "{{ nut_user_master_name }}"
nut_exporter_password: "{{ nut_user_master_password }}"
nut_exporter_vars: "battery.charge,battery.runtime,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,output.voltage,ups.load,ups.status,ups.test.result"
nut_exporter_listen_address: ":9199"
