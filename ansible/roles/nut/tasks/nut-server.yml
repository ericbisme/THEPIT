---

- name: install nut
  yum:
    name: nut
    state: present
  become: yes
  register: result
  until: result is success
  retries: 5
  delay: 5

- name: Install NUT configuration files.
  template:
    src: "{{ item }}.j2"
    dest: "/etc/ups/{{ item }}"
    owner: root
    group: nut
    mode: 0640
  with_items:
    - ups.conf
    - upsd.conf
    - upsd.users
    - upsmon.conf
    - nut.conf
  notify: Restart NUT

- name: add udev rules
  template:
    src: nut-ups.rules.sh
    dest: /etc/udev/rules.d/90-nut-ups.rules
    mode: 0644
  become: yes
  notify: Reload udev rules
