---

- name: install nut
  yum:
    name: nut
    state: present
  become: yes
  register: result
  until: result is success
  retries: 5
  delay: 5

- name: Install NUT configuration files.
  template:
    src: "{{ item }}.j2"
    dest: "/etc/ups/{{ item }}"
    owner: root
    group: nut
    mode: 0640
  with_items:
    - ups.conf
    - upsd.conf
    - upsd.users
    - upsmon.conf
    - nut.conf
  notify: Restart NUT

- name: add udev rules
  template:
    src: nut-ups.rules.sh
    dest: /etc/udev/rules.d/90-nut-ups.rules
    mode: 0644
  become: yes
  notify: Reload udev rules

- name: Apply UPS udev permissions to already-attached devices
  command: udevadm trigger --action=add
  become: true
  changed_when: false
  when: nut_driver_service_enabled | bool

- name: Reconcile Fedora NUT driver service instances
  command: /usr/sbin/upsdrvsvcctl resync
  become: true
  changed_when: false
  # Fedora's helper returns 42 when it made changes, even when reconciliation
  # completed successfully. Treat that documented non-zero status as success.
  failed_when: result.rc not in [0, 42]
  register: result
  when: nut_driver_service_enabled | bool

- name: Enable and start the configured NUT driver service
  systemd:
    name: "nut-driver@{{ nut_ups_name }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: nut_driver_service_enabled | bool
