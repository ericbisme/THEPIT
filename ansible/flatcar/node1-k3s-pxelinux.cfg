# Managed by THEPIT Ansible. k8s-node1: b8:ae:ed:e9:8c:a4
#
# The persistent-root K3s server is the default. RAM recovery stays selectable
# from the same menu if the normal profile or local root needs investigation.
UI menu.c32
PROMPT 0
TIMEOUT 100
MENU TITLE THEPIT k8s-node1 persistent-root K3s menu

LABEL flatcar-k3s
  MENU LABEL Boot Flatcar persistent-root K3s server (default)
  MENU DEFAULT
  KERNEL flatcar/releases/4593.2.5/flatcar_production_pxe.vmlinuz
  INITRD flatcar/releases/4593.2.5/flatcar_production_pxe_image.cpio.gz
  APPEND root=LABEL=FLATCAR_ROOT rootfstype=xfs rootflags=rw ip=dhcp rd.neednet=1 console=tty0 flatcar.autologin=tty1 sshkey="ssh-rsa  bolinger@porter.ericbisme.net" systemd.log_target=console systemd.log_level=info systemd.show_status=1 flatcar.first_boot=1 ignition.config.url=http://192.168.10.125/flatcar/ignition/k8s-node1-k3s.ign

LABEL flatcar-ram-recovery
  MENU LABEL Boot Flatcar RAM recovery + SSH
  KERNEL flatcar/releases/4593.2.5/flatcar_production_pxe.vmlinuz
  INITRD flatcar/releases/4593.2.5/flatcar_production_pxe_image.cpio.gz
  APPEND ip=dhcp rd.neednet=1 console=tty0 flatcar.autologin=tty1 sshkey="ssh-rsa  bolinger@porter.ericbisme.net" systemd.log_target=console systemd.log_level=info systemd.show_status=1 flatcar.first_boot=1 ignition.config.url=http://192.168.10.125/flatcar/ignition/k8s-node1-diagnostic.ign
