---
# Join the Fedora iMac as a regular THEPIT K3s worker.
# Supply the server token at runtime; never commit it:
#   K3S_JOIN_TOKEN="..." ansible-playbook -i inventory/hosts imac-k3s-agent.yml
- name: Join the iMac to THEPIT K3s as a worker
  hosts: cyberpower-imac
  become: true
  gather_facts: true

  vars:
    k3s_version: v1.36.3+k3s1
    k3s_sha256: 2f98a9f8fe5782479ee2d54e70a1b10a7f6fd4cae8d38ed3098452dc6eed76b5
    k3s_binary_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | replace('+', '%2B') }}/k3s"
    k3s_binary_path: /opt/bin/k3s
    k3s_server_url: https://192.168.10.126:6443
    k3s_node_name: cyberpower-imac
    k3s_node_ip: 192.168.1.37
    k3s_flannel_iface: enp3s0f0

  tasks:
    - name: Require the join token at runtime
      ansible.builtin.assert:
        that:
          - k3s_join_token is defined
          - k3s_join_token | length > 20
        fail_msg: Supply the existing K3s server token as k3s_join_token at runtime.
      no_log: true

    - name: Create K3s directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/bin, mode: "0755" }
        - { path: /etc/rancher/k3s, mode: "0700" }

    - name: Install the pinned K3s binary
      ansible.builtin.get_url:
        url: "{{ k3s_binary_url }}"
        dest: "{{ k3s_binary_path }}"
        checksum: "sha256:{{ k3s_sha256 }}"
        owner: root
        group: root
        mode: "0755"

    - name: Configure the iMac as a K3s worker
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          server: {{ k3s_server_url }}
          token: {{ k3s_join_token }}
          data-dir: /var/lib/rancher/k3s
          node-name: {{ k3s_node_name }}
          node-ip: {{ k3s_node_ip }}
          flannel-iface: {{ k3s_flannel_iface }}
          node-label:
            - thepit.org/role=worker
            - thepit.org/storage=ephemeral
      no_log: true

    - name: Install the K3s agent systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-agent.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Lightweight Kubernetes Agent
          Documentation=https://docs.k3s.io
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=exec
          KillMode=process
          Delegate=yes
          LimitNOFILE=1048576
          LimitNPROC=infinity
          LimitCORE=infinity
          TasksMax=infinity
          TimeoutStartSec=0
          Restart=always
          RestartSec=5s
          ExecStart={{ k3s_binary_path }} agent

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start K3s agent
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for the local K3s agent service
      ansible.builtin.command: systemctl is-active k3s-agent
      register: k3s_agent_status
      changed_when: false
      retries: 12
      delay: 5
      until: k3s_agent_status.rc == 0

